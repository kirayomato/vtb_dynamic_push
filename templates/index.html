<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTB Dynamic</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-primary: #1E1E1E;
            --bg-secondary: #2D2D2D;
            --bg-tertiary: #3C3C3C;
            --border: #444;
            --text-primary: white;
            --text-secondary: #888;
            --accent: #4A9EFF;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* 禁止外部滚动 */
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: Consolas, Monaco, monospace;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            /* 防止header被压缩 */
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        select,
        input,
        button {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 3px;
        }

        button:hover {
            background: #5A5A5A;
            cursor: pointer;
        }

        .log-container {
            flex: 1;
            /* 填充剩余空间 */
            overflow-y: auto;
            padding: 10px;
            min-height: 0;
            /* 重要：允许flex子项收缩 */
        }

        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
            border-radius: 2px;
            font-size: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .log-level {
            display: inline-block;
            width: 70px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .log-time {
            color: var(--text-secondary);
            margin-right: 10px;
        }

        .log-message {
            margin-left: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-url {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }

        .log-url:hover {
            color: #6BB6FF;
        }

        .stats {
            font-size: 12px;
            color: #AAA;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }

        /* 配置编辑器样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 5px;
            max-width: 900px;
            margin: 20px auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .config-section h3 {
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }

        .config-row label {
            width: 180px;
            flex-shrink: 0;
            font-size: 16px;
        }

        .config-row input,
        .config-row select {
            flex: 1;
            font-size: 16px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .raw-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .raw-toggle input {
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* 列表配置样式 */
        .list-config {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .list-items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .list-item {
            display: flex;
            gap: 3px;
            align-items: center;
            background: var(--bg-tertiary);
            padding: 3px 5px;
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .list-item-input {
            background: transparent;
            color: var(--text-primary);
            border: none;
            padding: 2px 5px;
            width: auto;
            min-width: 30px;
            max-width: 100px;
        }

        .list-item-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .list-item-remove {
            background: transparent;
            color: #d32f2f;
            border: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
        }

        .list-item-remove:hover {
            color: #f44336;
            background: rgba(211, 47, 47, 0.2);
            border-radius: 2px;
        }

        .list-item-name {
            color: rgb(255 245 11);
            font-size: 16px;
            padding: 2px 8px;
            background: transparent;
            border-radius: 3px;
            white-space: nowrap;
        }

        .list-item-add {
            background: transparent;
            color: #4caf50;
            border: 1px dashed #4caf50;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            align-self: flex-start;
        }

        .list-item-add:hover {
            background: rgba(76, 175, 80, 0.1);
        }

        /* 调度器面板样式 */
        .scheduler-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .scheduler-card-header {
            padding: 10px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .scheduler-card-header h3 {
            margin: 0;
            color: var(--accent);
            font-size: 16px;
        }

        .scheduler-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .scheduler-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
        }

        .scheduler-badge.on {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .scheduler-badge.off {
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }

        .scheduler-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .scheduler-table th,
        .scheduler-table td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .scheduler-table th {
            color: var(--text-secondary);
            font-weight: bold;
            position: sticky;
            top: 0;
            background: var(--bg-tertiary);
        }

        .scheduler-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .scheduler-name {
            color: rgb(255 245 11);
            font-weight: bold;
        }

        .scheduler-empty {
            padding: 15px;
            color: var(--text-secondary);
            text-align: center;
        }

        .weight-bar {
            display: inline-block;
            height: 8px;
            background: var(--accent);
            border-radius: 4px;
            vertical-align: middle;
            margin-right: 6px;
        }

        .scheduler-static-row {
            background: rgba(255, 245, 11, 0.06);
        }

        .badge-pin {
            display: inline-block;
            padding: 0 5px;
            margin-right: 4px;
            border-radius: 8px;
            font-size: 11px;
            background: rgba(255, 245, 11, 0.2);
            color: rgb(255 245 11);
            vertical-align: middle;
        }

        .static-weight-input {
            width: 70px;
            padding: 2px 6px;
            font-size: 13px;
            text-align: center;
        }

        /* ===== 只读 SQL 浏览器 ===== */
        .sql-modal-content {
            max-width: 1280px;
        }

        .sql-body {
            display: flex;
            gap: 12px;
            max-height: 72vh;
            padding: 12px;
        }

        .sql-sidebar {
            width: 220px;
            flex-shrink: 0;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding-right: 10px;
        }

        .sql-sidebar-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .sql-table-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            margin-bottom: 4px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid transparent;
        }

        .sql-table-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .sql-table-item.active {
            background: rgba(74, 158, 255, 0.15);
            border-color: var(--accent);
        }

        .sql-table-count {
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .sql-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        #sqlInput {
            width: 100%;
            height: 110px;
            resize: vertical;
            padding: 8px 10px;
            font-family: Consolas, Monaco, monospace;
            font-size: 15px;
            line-height: 1.5;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 3px;
        }

        #sqlInput:focus {
            outline: none;
            border-color: var(--accent);
        }

        .sql-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sql-status {
            font-size: 13px;
            color: var(--text-secondary);
            min-height: 18px;
        }

        .sql-status.error {
            color: #FF8080;
        }

        .sql-status.ok {
            color: #80FF80;
        }

        .sql-schema {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.7;
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 3px;
            max-height: 96px;
            overflow-y: auto;
            word-break: break-word;
        }

        .sql-schema code {
            color: rgb(255 245 11);
        }

        .sql-result {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 3px;
            min-height: 120px;
        }

        .sql-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .sql-table th {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .sql-table td {
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sql-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .sql-row-num {
            color: var(--text-secondary);
            text-align: right;
            width: 1%;
            white-space: nowrap;
        }

        .sql-cell-null {
            color: #777;
            font-style: italic;
        }

        .sql-cell-num {
            color: var(--accent);
        }

        .badge-readonly {
            display: inline-block;
            padding: 2px 8px;
            margin-left: 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: normal;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>VTB Dynamic</h1>
        <div class="controls">
            <div class="filter-group">
                <label>级别:</label>
                <select id="levelFilter">
                    <option value="">全部</option>
                    <option value="ERROR">错误</option>
                    <option value="WARNING">警告</option>
                    <option value="INFO">信息</option>
                    <option value="DEBUG">调试</option>
                </select>
            </div>
            <div class="filter-group">
                <label>搜索:</label>
                <input type="text" id="searchInput" placeholder="搜索日志内容...">
            </div>
            <div class="filter-group">
                <label>字体:</label>
                <select id="fontSize">
                    <option value="12px">12px</option>
                    <option value="16px">16px</option>
                    <option value="16px">16px</option>
                    <option value="18px" selected>18px</option>
                    <option value="20px">20px</option>
                    <option value="24px">24px</option>
                </select>
            </div>
            <button onclick="openConfigEditor()">编辑配置</button>
            <button onclick="updateCookies('weibo')">更新微博Cookie</button>
            <button onclick="updateCookies('bili')">更新B站Cookie</button>
            <button onclick="openSchedulerPanel()">调度器</button>
            <button onclick="openSqlBrowser()">SQL 浏览器</button>
            <div class="stats"><span id="logCount">0 条日志</span></div>
        </div>
    </div>
    <div class="log-container" id="logContainer">
        <div class="loading">正在加载日志...</div>
    </div>

    <!-- 调度器信息弹窗 -->
    <div class="modal" id="schedulerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>调度器状态</h2>
                <button onclick="closeSchedulerPanel()">×</button>
            </div>
            <div class="modal-body" id="schedulerBody">
                <div class="loading">加载中...</div>
            </div>
            <div class="modal-footer">
                <span class="stats" id="schedulerUpdated"></span>
                <button onclick="closeSchedulerPanel()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 配置编辑器弹窗 -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑配置</h2>
                <label class="raw-toggle" title="切换 uid 列表为原始逗号分隔字符串显示">
                    <input type="checkbox" id="rawListToggle"> 显示原始字符串
                </label>
                <button onclick="closeConfigEditor()">×</button>
            </div>
            <div class="modal-body" id="configForm">
                <div class="loading">加载中...</div>
            </div>
            <div class="modal-footer">
                <button onclick="saveConfig()">保存</button>
                <button onclick="closeConfigEditor()">取消</button>
            </div>
        </div>
    </div>

    <!-- 只读 SQL 浏览器弹窗 -->
    <div class="modal" id="sqlModal">
        <div class="modal-content sql-modal-content">
            <div class="modal-header">
                <h2>SQL 浏览器<span class="badge-readonly">只读</span></h2>
                <span class="scheduler-meta" id="sqlDbInfo"></span>
                <button onclick="closeSqlBrowser()">×</button>
            </div>
            <div class="sql-body">
                <div class="sql-sidebar">
                    <p class="sql-sidebar-title">数据表</p>
                    <div id="sqlTables">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                <div class="sql-main">
                    <textarea id="sqlInput" spellcheck="false" placeholder="在此输入只读 SQL，Ctrl+Enter 执行（点左侧表名可快速查看数据）"></textarea>
                    <div class="sql-toolbar">
                        <button onclick="runSql()">执行</button>
                        <button onclick="clearSql()">清空</button>
                        <div class="sql-status" id="sqlStatus"></div>
                    </div>
                    <div class="sql-schema" id="sqlSchema">点击左侧表名可查看字段结构并预览数据</div>
                    <div class="sql-result" id="sqlResult">
                        <div class="loading">输入 SQL 后点击执行</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span class="stats">只读模式：仅支持 SELECT / WITH / VALUES / EXPLAIN / PRAGMA 单条语句，最多返回 1000 行，超时 5 秒自动中断</span>
                <button onclick="closeSqlBrowser()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            latestId: 0,
            oldestId: null,
            loading: false,
            hasMore: true
        };
        const $ = id => document.getElementById(id);
        const container = $('logContainer');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadLogs('/logs/latest?limit=50', false);
            setInterval(() => loadLogs(`/logs?since_id=${state.latestId}`, true), 1000);

            container.addEventListener('scroll', () => {
                const nearBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 100;
                if (nearBottom && !state.loading && state.hasMore) loadHistory();
            });

            $('levelFilter').addEventListener('change', filterLogs);
            $('searchInput').addEventListener('input', filterLogs);
            $('fontSize').addEventListener('change', updateFontSize);

            const saved = localStorage.getItem('logFontSize');
            if (saved) { $('fontSize').value = saved; updateFontSize(); }

            // uid 列表显示模式：勾选后列表配置直接显示原始逗号分隔字符串
            $('rawListToggle').addEventListener('change', e => {
                localStorage.setItem('rawListMode', e.target.checked ? '1' : '');
                if (lastConfig) renderConfig(lastConfig);
            });
            if (localStorage.getItem('rawListMode')) $('rawListToggle').checked = true;

            // SQL 浏览器：Ctrl+Enter 执行
            $('sqlInput').addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    runSql();
                }
            });
        });

        // 加载日志
        async function loadLogs(url, prepend) {
            try {
                const { logs } = await fetch(url).then(r => r.json());
                if (!logs?.length) return;

                if (container.querySelector('.loading')) container.innerHTML = '';

                const sorted = [...logs].sort((a, b) => b.id - a.id);
                sorted.forEach(log => addLog(log, prepend));

                state.latestId = Math.max(state.latestId, ...logs.map(l => l.id));
                if (!prepend && logs.length) state.oldestId = Math.min(...logs.map(l => l.id));

                updateCount();
                if (!prepend) container.scrollTop = 0;
            } catch (e) { console.error(e); }
        }

        // 加载历史
        async function loadHistory() {
            if (state.loading || !state.hasMore || state.oldestId === null) return;
            state.loading = true;
            showLoading(true);

            try {
                const { logs, has_more, oldest_id } = await fetch(`/logs/history?before_id=${state.oldestId}&limit=25`).then(r => r.json());
                logs?.forEach(log => addLog(log, false));
                state.hasMore = has_more;
                state.oldestId = oldest_id;
                updateCount();
            } catch (e) { console.error(e); }

            state.loading = false;
            showLoading(false);
        }

        // HTML转义函数
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 添加日志条目
        function addLog(log, prepend = true) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.dataset.logId = log.id;
            div.dataset.level = log.level;
            div.style.cssText = `color: ${log.color}; font-size: ${$('fontSize').value}`;

            const time = new Date(log.timestamp).toLocaleTimeString();
            let msg = log.message;
            if (log.urls && log.urls.length > 0) {
                // 先用占位符替换URL，再转义HTML，最后还原URL为链接
                const placeholders = [];
                log.urls.forEach((url, i) => {
                    const placeholder = `__URL_${i}__`;
                    placeholders.push({ placeholder, url });
                    msg = msg.replace(`url: ${url}`, `url: ${placeholder}`);
                });
                msg = escapeHtml(msg);
                placeholders.forEach(({ placeholder, url }) => {
                    msg = msg.replace(placeholder, `<a href="${url}" target="_blank" class="log-url">${escapeHtml(url)}</a>`);
                });
            } else {
                msg = escapeHtml(msg);
            }

            div.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-level" style="color:${log.color}">${log.level}</span>
                <span class="log-message">${msg}</span>`;

            const loading = $('historyLoading');
            prepend ? container.insertBefore(div, container.firstChild)
                : loading ? container.insertBefore(div, loading) : container.appendChild(div);

            // 限制数量
            const entries = container.querySelectorAll('.log-entry');
            if (entries.length > 1000) entries[prepend ? entries.length - 1 : 0].remove();
        }

        // 显示/隐藏加载指示
        function showLoading(show) {
            let el = $('historyLoading');
            if (show && !el) {
                el = document.createElement('div');
                el.id = 'historyLoading';
                el.className = 'loading';
                el.textContent = '正在加载历史日志...';
                container.appendChild(el);
            } else if (!show && el) el.remove();
        }

        // 过滤日志
        function filterLogs() {
            const level = $('levelFilter').value;
            const search = $('searchInput').value.toLowerCase();
            container.querySelectorAll('.log-entry').forEach(log => {
                const match = (!level || log.dataset.level === level) &&
                    (!search || log.textContent.toLowerCase().includes(search));
                log.style.display = match ? 'block' : 'none';
            });
        }

        // 更新字体
        function updateFontSize() {
            const size = $('fontSize').value;
            container.querySelectorAll('.log-entry').forEach(el => el.style.fontSize = size);
            localStorage.setItem('logFontSize', size);
        }

        // 更新计数
        function updateCount() {
            $('logCount').textContent = `${container.querySelectorAll('.log-entry').length} 条日志`;
        }

        // 更新Cookies
        async function updateCookies(type) {
            const name = type === 'weibo' ? '微博' : 'B站';
            const content = prompt(`请输入新的${name}Cookies:`);
            if (!content) return;
            try {
                const { message, error } = await fetch(`/write-${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: content
                }).then(r => r.json());
                alert(message || error);
            } catch (e) { alert('错误: ' + e); }
        }

        // 打开配置编辑器
        async function openConfigEditor() {
            const modal = $('configModal');
            modal.classList.add('active');
            await loadConfig();
        }

        // 关闭配置编辑器
        function closeConfigEditor() {
            $('configModal').classList.remove('active');
        }

        // 检查是否是逗号分隔的列表配置
        function isListConfig(key, value) {
            return value.includes(',') || key.includes('list');
        }

        // 获取B站用户名
        async function fetchBiliUserNames(uids) {
            try {
                const response = await fetch(`/user_info/bili/batch?uids=${uids.join(',')}`);
                return await response.json();
            } catch (e) {
                console.error('获取B站用户名失败:', e);
                return {};
            }
        }

        // 获取微博用户名
        async function fetchWeiboUserNames(uids) {
            try {
                const response = await fetch(`/user_info/weibo/batch?uids=${uids.join(',')}`);
                return await response.json();
            } catch (e) {
                console.error('获取微博用户名失败:', e);
                return {};
            }
        }

        // 加载配置
        let lastConfig = null; // 缓存最近一次拉取的配置，供切换显示模式时重渲染

        function isRawListMode() {
            return $('rawListToggle').checked;
        }

        async function loadConfig() {
            try {
                const { config, error } = await fetch('/config').then(r => r.json());
                if (error) { alert(error); return; }
                lastConfig = config;
                await renderConfig(config);
            } catch (e) { alert('加载配置失败: ' + e); }
        }

        async function renderConfig(config) {
            try {
                const rawMode = isRawListMode();

                // 收集所有B站UID（原始字符串模式下无需解析昵称）
                const biliUids = [];
                const biliUidKeys = ['dynamic_uid_list', 'live_uid_list', 'special_list'];
                const weiboUids = [];
                if (!rawMode) {
                    for (const [section, options] of Object.entries(config)) {
                        for (const [key, value] of Object.entries(options)) {
                            if (biliUidKeys.includes(key) && value) {
                                value.split(',').forEach(uid => {
                                    uid = uid.trim();
                                    if (uid && !biliUids.includes(uid)) {
                                        biliUids.push(uid);
                                    }
                                });
                            }
                        }
                    }

                    // 收集所有微博UID
                    for (const [section, options] of Object.entries(config)) {
                        if (section === 'weibo' && options.uid_list) {
                            options.uid_list.split(',').forEach(uid => {
                                uid = uid.trim();
                                if (uid && !weiboUids.includes(uid)) {
                                    weiboUids.push(uid);
                                }
                            });
                        }
                    }
                }

                // 获取用户名
                const biliUserNamesMap = biliUids.length > 0 ? await fetchBiliUserNames(biliUids) : {};
                const weiboUserNamesMap = weiboUids.length > 0 ? await fetchWeiboUserNames(weiboUids) : {};

                let html = '';
                for (const [section, options] of Object.entries(config)) {
                    html += `<div class="config-section"><h3>[${section}]</h3>`;
                    for (const [key, value] of Object.entries(options)) {
                        const inputType = key.includes('enable') ? 'select' : 'input';
                        if (inputType === 'select') {
                            html += `<div class="config-row">
                                <label>${key}:</label>
                                <select data-section="${section}" data-key="${key}">
                                    <option value="true" ${value === 'true' ? 'selected' : ''}>true</option>
                                    <option value="false" ${value === 'false' ? 'selected' : ''}>false</option>
                                </select>
                            </div>`;
                        } else if (!rawMode && isListConfig(key, value)) {
                            // 逗号分隔的列表配置（原始字符串模式下直接显示原始文本）
                            const items = value.split(',').map(item => item.trim()).filter(item => item);
                            const isBiliUid = section === 'bili';
                            const isWeiboUid = section === 'weibo';
                            html += `<div class="config-row">
                                <label>${key}:</label>
                                <div class="list-config" data-section="${section}" data-key="${key}">
                                    <div class="list-items">`;
                            items.forEach((item) => {
                                let displayName = '';
                                if (isBiliUid && biliUserNamesMap[item]) {
                                    displayName = `<span class="list-item-name">${escapeHtml(biliUserNamesMap[item])}</span>`;
                                } else if (isWeiboUid && weiboUserNamesMap[item]) {
                                    displayName = `<span class="list-item-name">${escapeHtml(weiboUserNamesMap[item])}</span>`;
                                }
                                html += `<div class="list-item">
                                    <input type="text" value="${escapeHtml(item)}" class="list-item-input">
                                    ${displayName}
                                    <button class="list-item-remove" onclick="removeListItem(this)">×</button>
                                </div>`;
                            });
                            html += `</div>
                                    <button class="list-item-add" onclick="addListItem(this)">+ 添加</button>
                                </div>
                            </div>`;
                        } else {
                            html += `<div class="config-row">
                                <label>${key}:</label>
                                <input type="text" data-section="${section}" data-key="${key}" value="${escapeHtml(value)}">
                            </div>`;
                        }
                    }
                    html += '</div>';
                }
                $('configForm').innerHTML = html;
            } catch (e) { alert('加载配置失败: ' + e); }
        }

        // 添加列表项
        function addListItem(btn) {
            const listContainer = btn.previousElementSibling;
            const section = btn.closest('.list-config').dataset.section;
            const key = btn.closest('.list-config').dataset.key;
            const newItem = document.createElement('div');
            newItem.className = 'list-item';
            newItem.innerHTML = `
                <input type="text" value="" class="list-item-input">
                <button class="list-item-remove" onclick="removeListItem(this)">×</button>
            `;
            listContainer.appendChild(newItem);
        }

        // 删除列表项
        function removeListItem(btn) {
            btn.parentElement.remove();
        }

        // 保存配置
        async function saveConfig() {
            const formData = {};
            document.querySelectorAll('[data-section]').forEach(el => {
                const section = el.dataset.section;
                const key = el.dataset.key;
                let value = el.value;

                if (!formData[section]) formData[section] = {};

                // 处理列表配置
                if (el.classList.contains('list-config')) {
                    const inputs = el.querySelectorAll('.list-item-input');
                    value = Array.from(inputs)
                        .map(input => input.value.trim())
                        .filter(item => item)
                        .join(',');
                }

                formData[section][key] = value;
            });

            try {
                const { message, error } = await fetch('/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                }).then(r => r.json());

                if (error) alert(error);
                else {
                    alert(message);
                    closeConfigEditor();
                }
            } catch (e) { alert('保存失败: ' + e); }
        }

        // ===== 调度器面板 =====
        const schedulerState = {
            open: false,
            timer: null,
            nameMap: {} // uid -> 显示名 缓存
        };

        // 调度器名称（线程名）到用户名解析类型的映射
        const SCHEDULER_NAME_TYPE = {
            weibo: 'weibo',
            bili_dy: 'bili'
        };

        function openSchedulerPanel() {
            schedulerState.open = true;
            $('schedulerModal').classList.add('active');
            refreshScheduler();
            // 每 2 秒自动刷新
            schedulerState.timer = setInterval(refreshScheduler, 2000);
        }

        function closeSchedulerPanel() {
            schedulerState.open = false;
            $('schedulerModal').classList.remove('active');
            if (schedulerState.timer) {
                clearInterval(schedulerState.timer);
                schedulerState.timer = null;
            }
        }

        // 格式化相对时间
        function formatRelative(ts) {
            if (!ts) return '—';
            const diff = (Date.now() - ts * 1000) / 1000; // 秒
            if (diff < 0) diff = 0;
            if (diff < 60) return `${Math.floor(diff)} 秒前`;
            if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
            return `${Math.floor(diff / 3600)} 小时前`;
        }

        async function resolveNames(schedulers) {
            // 收集需要解析名称的 uid
            const pending = {};
            for (const [name, info] of Object.entries(schedulers)) {
                const type = SCHEDULER_NAME_TYPE[name];
                if (!type) continue;
                for (const t of info.targets) {
                    const key = t.key;
                    if (schedulerState.nameMap[key]) continue;
                    (pending[type] = pending[type] || []).push(key);
                }
            }
            const results = {};
            if (pending.weibo?.length) {
                const map = await fetchWeiboUserNames(pending.weibo);
                Object.assign(results, map);
            }
            if (pending.bili?.length) {
                const map = await fetchBiliUserNames(pending.bili);
                Object.assign(results, map);
            }
            Object.assign(schedulerState.nameMap, results);
        }

        async function refreshScheduler() {
            if (!schedulerState.open) return;
            try {
                const data = await fetch('/scheduler').then(r => r.json());
                if (data.error) {
                    $('schedulerBody').innerHTML = `<div class="scheduler-empty">${escapeHtml(data.error)}</div>`;
                    return;
                }
                const info = data.scheduler || {};
                const names = Object.keys(info);
                await resolveNames(info);

                if (names.length === 0) {
                    $('schedulerBody').innerHTML = '<div class="scheduler-empty">暂无运行中的调度器</div>';
                    $('schedulerUpdated').textContent = '';
                    return;
                }

                let html = '';
                for (const name of names) {
                    const s = info[name];
                    const badge = s.enable
                        ? '<span class="scheduler-badge on">已启用</span>'
                        : '<span class="scheduler-badge off">已禁用</span>';
                    html += `
                        <div class="scheduler-card">
                            <div class="scheduler-card-header">
                                <h3>${escapeHtml(s.label || name)}</h3>
                                ${badge}
                                <span class="scheduler-meta">
                                    目标数: ${s.target_count} ·
                                    总权重: ${s.total_weight} ·
                                    最大权重: ${s.max_weight}
                                </span>
                            </div>`;
                    if (s.targets.length === 0) {
                        html += '<div class="scheduler-empty">无监控目标</div>';
                    } else {
                        html += `
                            <table class="scheduler-table">
                                <thead>
                                    <tr>
                                        <th>目标</th>
                                        <th>权重</th>
                                        <th>当前权重</th>
                                        <th>访问次数</th>
                                        <th>平均间隔(s)</th>
                                        <th>最近访问</th>
                                        <th>静态权重</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        // 按权重降序排列，便于观察调度顺序
                        const sorted = [...s.targets].sort(
                            (a, b) => b.weight - a.weight
                        );
                        const maxW = Math.max(...s.targets.map(t => t.weight), 1);
                        for (const t of sorted) {
                            const displayName = schedulerState.nameMap[t.key] || '';
                            const nameCell = displayName
                                ? `${escapeHtml(t.key)} <span class="scheduler-name">(${escapeHtml(displayName)})</span>`
                                : escapeHtml(t.key);
                            const barW = Math.max(2, (t.weight / maxW) * 80);
                            const rowCls = t.static ? ' class="scheduler-static-row"' : '';
                            const pinMark = t.static ? '<span class="badge-pin">固定</span> ' : '';
                            html += `
                                <tr${rowCls}>
                                    <td>${nameCell}</td>
                                    <td>${pinMark}<span class="weight-bar" style="width:${barW}px"></span>${t.weight}</td>
                                    <td>${t.current_weight}</td>
                                    <td>${t.access_count}</td>
                                    <td>${t.avg_interval ?? '—'}</td>
                                    <td>${formatRelative(t.last_access)}</td>
                                    <td>
                                        <input class="static-weight-input" type="number" step="any" min="0"
                                            value="${t.static_weight ?? ''}"
                                            title="手动固定权重（留空解除固定），修改后自动保存"
                                            onchange="setStaticWeight(this, '${t.key}', '${name}')">
                                    </td>
                                </tr>`;
                        }
                        html += '</tbody></table>';
                    }
                    html += '</div>';
                }
                $('schedulerBody').innerHTML = html;
                $('schedulerUpdated').textContent = `更新于 ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                $('schedulerBody').innerHTML = `<div class="scheduler-empty">加载失败: ${escapeHtml(e)}</div>`;
            }
        }

        // 设置/清除某个目标的静态固定权重
        async function setStaticWeight(input, uid, schedulerName) {
            const val = input.value.trim();
            let weight = null;
            if (val !== '') {
                const n = Number(val);
                if (!isFinite(n) || n <= 0) {
                    alert('权重必须是大于0的数字');
                    input.value = '';
                    return;
                }
                weight = n;
            }
            try {
                const res = await fetch('/scheduler/static_weight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scheduler: schedulerName, uid, weight })
                }).then(r => r.json());
                if (res.error) {
                    alert(res.error);
                    input.value = weight ?? '';
                }
                refreshScheduler(); // 立即刷新以反映最新状态
            } catch (e) { alert('保存失败: ' + e); }
        }

        // ===== 只读 SQL 浏览器 =====
        const sqlState = { open: false, tables: [], running: false };

        function openSqlBrowser() {
            sqlState.open = true;
            $('sqlModal').classList.add('active');
            if (!sqlState.tables.length) loadSqlTables();
        }

        function closeSqlBrowser() {
            sqlState.open = false;
            $('sqlModal').classList.remove('active');
        }

        // 加载数据表列表（名称 + 行数）
        async function loadSqlTables() {
            const box = $('sqlTables');
            box.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const data = await fetch('/sql/tables').then(r => r.json());
                if (data.error) {
                    box.innerHTML = `<div class="loading">${escapeHtml(data.error)}</div>`;
                    return;
                }
                sqlState.tables = data.tables || [];
                $('sqlDbInfo').textContent = data.db
                    ? `${data.db} · ${sqlState.tables.length} 张表` : '';
                if (!sqlState.tables.length) {
                    box.innerHTML = '<div class="loading">数据库暂无表</div>';
                    return;
                }
                box.innerHTML = sqlState.tables.map(t => `
                    <div class="sql-table-item" data-table="${escapeHtml(t.name)}"
                        title="${t.type === 'view' ? '视图' : '表'}，点击预览数据"
                        onclick="selectSqlTable(this)">
                        <span>${escapeHtml(t.name)}</span>
                        <span class="sql-table-count">${t.rows ?? '—'}</span>
                    </div>`).join('');
            } catch (e) {
                box.innerHTML = `<div class="loading">加载失败: ${escapeHtml(String(e))}</div>`;
            }
        }

        // 点击表名：显示结构 + 预览前 100 行
        async function selectSqlTable(el) {
            document.querySelectorAll('.sql-table-item')
                .forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const name = el.dataset.table;
            $('sqlInput').value = `SELECT * FROM "${name}" LIMIT 100;`;
            await loadSqlSchema(name);
            runSql();
        }

        // 展示字段结构
        async function loadSqlSchema(table) {
            const box = $('sqlSchema');
            box.textContent = '读取表结构...';
            try {
                const d = await fetch(`/sql/schema?table=${encodeURIComponent(table)}`)
                    .then(r => r.json());
                if (d.error) { box.textContent = d.error; return; }
                const cols = (d.columns || []).map(c => {
                    const flags = [
                        c.type || 'ANY',
                        c.pk ? 'PK' : '',
                        c.notnull ? 'NOT NULL' : '',
                        c.default !== null && c.default !== undefined ? `DEFAULT ${c.default}` : ''
                    ].filter(Boolean).join(' ');
                    return `<code>${escapeHtml(c.name)}</code> ${escapeHtml(flags)}`;
                });
                box.innerHTML = `字段（${cols.length}）：${cols.join('　|　') || '无'}`;
            } catch (e) {
                box.textContent = '读取表结构失败: ' + e;
            }
        }

        // 执行只读查询
        async function runSql() {
            const sql = $('sqlInput').value.trim();
            if (!sql) { setSqlStatus('请输入 SQL', 'error'); return; }
            if (sqlState.running) return;
            sqlState.running = true;
            setSqlStatus('执行中...', '');
            try {
                const res = await fetch('/sql/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql })
                }).then(r => r.json());
                if (res.error) {
                    setSqlStatus(res.error, 'error');
                    $('sqlResult').innerHTML = '<div class="loading">查询未执行</div>';
                    return;
                }
                renderSqlResult(res);
            } catch (e) {
                setSqlStatus('请求失败: ' + e, 'error');
            } finally {
                sqlState.running = false;
            }
        }

        function clearSql() {
            $('sqlInput').value = '';
            $('sqlStatus').className = 'sql-status';
            $('sqlStatus').textContent = '';
            $('sqlResult').innerHTML = '<div class="loading">输入 SQL 后点击执行</div>';
        }

        function setSqlStatus(text, cls) {
            const el = $('sqlStatus');
            el.textContent = text;
            el.className = 'sql-status' + (cls ? ' ' + cls : '');
        }

        // 渲染结果表格
        function renderSqlResult(res) {
            const cols = res.columns || [];
            if (!cols.length) {
                $('sqlResult').innerHTML = '<div class="loading">该语句没有返回结果集</div>';
                setSqlStatus(`执行成功 · 用时 ${res.elapsed_ms} ms`, 'ok');
                return;
            }
            const head = '<tr><th class="sql-row-num">#</th>' +
                cols.map(c => `<th>${escapeHtml(String(c))}</th>`).join('') + '</tr>';
            const body = (res.rows || []).map((row, i) =>
                `<tr><td class="sql-row-num">${i + 1}</td>` +
                row.map(renderSqlCell).join('') + '</tr>').join('');
            $('sqlResult').innerHTML =
                `<table class="sql-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;

            let msg = `返回 ${res.row_count} 行 · ${cols.length} 列 · 用时 ${res.elapsed_ms} ms`;
            if (res.truncated) msg += ` · 已达上限 ${res.limit} 行，结果被截断`;
            setSqlStatus(msg, res.truncated ? '' : 'ok');
        }

        function renderSqlCell(v) {
            if (v === null || v === undefined) {
                return '<td><span class="sql-cell-null">NULL</span></td>';
            }
            if (typeof v === 'number') return `<td class="sql-cell-num">${v}</td>`;
            const text = String(v);
            const shown = text.length > 200 ? text.slice(0, 200) + '…' : text;
            return `<td title="${escapeHtml(text)}">${escapeHtml(shown)}</td>`;
        }
    </script>
</body>

</html>
